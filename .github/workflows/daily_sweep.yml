# .github/workflows/daily_sweep.yml
# ----------------------------------------------------------------
# Full-book sweep, every two days (name kept for continuity): fetches
# the entire biddable universe
# (prod_biddable, Phase 4 -- ~52k wines, not just BBX-listed ones)
# via Algolia, tiers REST pricing (listed always, unlisted via wave
# pricing), diffs against the persistent scan store, and records
# state transitions (appeared, price changed, disappeared).
# ----------------------------------------------------------------

name: BBX Daily Sweep

on:
  schedule:
    # Hourly from 16:07 to 00:07 UTC, every day. Each trigger checks for
    # itself and exits within seconds unless it is 22:00-01:00 UK time and no
    # sweep has run in the last two days (core/sweep_window.py). GitHub has
    # started scheduled runs up to 6.5 h late, so firing hourly through the
    # evening lets one land in the window, wherever the delay falls. Off the
    # hour (:07) to avoid GitHub's busiest top-of-hour queue.
    - cron: "7 16-23 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:        # manual trigger

concurrency:
  group: bbx-daily-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Discovery now covers the full ~52k-wine biddable universe rather than
    # the ~15k-wine listed book. A live single-region (Burgundy, ~28k
    # records) discovery-only test took ~4.5 minutes on 2026-07-24; the full
    # multi-region sweep is untested end-to-end, so this is a conservative
    # estimate, not a measured figure -- watch the actual duration on the
    # first few runs and adjust.
    timeout-minutes: 90

    env:
      ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
      ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      # UNVERIFIED (docs/PHASE3-4-IMPLEMENTATION.md Step 6): defaults to
      # false/unset so delta selection runs in shadow mode only. Set the
      # repository variable WAVE_PRICING_DELTA_ENABLED to "true" only after
      # index_last_update has been compared against real observed price
      # changes on the listed book for at least a week.
      WAVE_PRICING_DELTA_ENABLED: ${{ vars.WAVE_PRICING_DELTA_ENABLED }}
      # Scheduled triggers apply the window and cadence guard; manual runs don't.
      SWEEP_SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Runner's own python3, before any setup, so out-of-window triggers
      # finish in seconds.
      - name: Check sweep window
        id: window
        if: github.event_name == 'schedule'
        run: python3 -m core.sweep_window

      - name: Set up Python
        if: github.event_name != 'schedule' || steps.window.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.window.outputs.run == 'true'
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        if: github.event_name != 'schedule' || steps.window.outputs.run == 'true'
        run: python -m pytest tests/ -q

      - name: Run daily sweep
        if: github.event_name != 'schedule' || steps.window.outputs.run == 'true'
        run: python apps/daily_sweep/run_sweep.py

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":warning: BBX daily sweep FAILED. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK"
