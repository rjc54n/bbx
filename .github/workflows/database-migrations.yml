name: Database migration validation

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-migrations.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Replay migrations on a clean local database
        run: supabase db start

      - name: Lint the public schema
        run: >-
          supabase db lint
          --local
          --schema public
          --level warning
          --fail-on error

      - name: Test database permissions and import behaviour
        run: supabase test db

      # pgTAP runs in one session, so the rules that only bind across
      # transactions -- one nomination, no historical snapshot dated after it --
      # are asserted by a two-session harness against this local database.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the concurrency harness dependencies
        run: pip install -r requirements-dev.txt

      - name: Test concurrent BBR snapshot acceptance
        run: python -m pytest tests/test_bbr_acceptance_concurrency.py -q

      - name: Remove the local database
        if: always()
        run: supabase stop --no-backup
